[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-ai"
version = "0.1.0"
description = "AI-powered code documentation analysis and generation pipeline"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "google-genai>=1,<2",
    "openai>=1,<2",
    "groq",
]

[tool.setuptools.packages.find]
include = ["core_ai*"]

[project.scripts]
core-ai-demo = "core_ai.run_demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage.run]
omit = [
    "core_ai/run_demo.py",
    "core_ai/demo_project/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B",
]
